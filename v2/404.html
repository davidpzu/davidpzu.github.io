<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">

  <title>哎呀 — Page not found · David Prieto Zurita</title>
  <meta name="description" content="That page does not exist.">

  <!-- ============================================================ paths
       This page breaks §0's "relative paths everywhere", and it is the one
       page that has to. GitHub Pages serves 404.html for *any* unmatched
       URL while leaving the browser's address at what was asked for — a
       request for /work/typo/deep makes every relative path resolve against
       /work/typo/, so `assets/…` would 404 inside the 404. Root-relative is
       the only form that resolves the same from every depth.

       Everything else follows from that: the CSS is inline rather than a
       <link>, so there is no stylesheet request to get wrong, and the whole
       page is one file with two font requests. A 404 should not have
       dependencies that can themselves fail.

       Only linked at the root. GitHub Pages uses the repo root's 404.html
       and ignores one in a subdirectory, so this does nothing at
       /v2/404.html beyond being viewable directly. It starts working at
       promotion, when it moves to the root with everything else — and it
       keeps its noindex when the other five pages lose theirs. §3.11 -->

  <link rel="icon" href="/assets/img/favicon/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/favicon/apple-touch-icon.png">

  <style>
    /* Two faces, root-relative, with a real fallback stack behind each.
       If the fonts do not resolve the page is still composed — it just
       renders in the system mono. */
    @font-face {
      font-family: "Geist Mono";
      src: url("/assets/fonts/geist-mono-v6-latin-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Geist Mono";
      src: url("/assets/fonts/geist-mono-v6-latin-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    /* The tokens this page actually uses. Copied rather than imported, for
       the same reason the CSS is inline — kept to the handful that appear
       below so there is no second copy of tokens.css to drift. */
    :root {
      --paper:     #FCFCFA;
      --ink:       #14150F;
      --ink-muted: #6E6E68;
      --rule:      #E2E2DC;
      --accent:    #1F3BFF;
      --grid-line: #EDEDE7;

      --s-2: 1rem;  --s-3: 1.5rem;  --s-4: 2rem;  --s-6: 4.5rem;
      --shell: min(1140px, 92vw);

      --font-display: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
      /* No CJK glyph exists in a latin-subset woff2, so 哎呀 was always
         going to come from the system. Naming the stack makes that a choice
         rather than an accident: PingFang on macOS and iOS, YaHei on
         Windows, Noto on Linux and Android. §3.11 */
      --font-hans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                   "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      /* `safe` is what stops a short viewport clipping the top of the
         panel unreachably — plain `center` overflows both edges and only
         the bottom one is scrollable. The unprefixed value stays first as
         the fallback for anything that does not parse `safe`. */
      justify-content: center;
      justify-content: safe center;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-display);
      -webkit-font-smoothing: antialiased;
    }

    /* ------------------------------------------------- the vertical grid */
    /* The same three hairlines every section of the site carries: the
       shell's left edge, its centre, its right edge. Same technique as
       layout.css — one element, three background layers, no extra markup —
       but fixed and full-height, because this page has no sections for it
       to be drawn per. */
    .grid-field {
      position: fixed;
      z-index: 0;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: var(--shell);
      pointer-events: none;
      background-image:
        linear-gradient(var(--grid-line), var(--grid-line)),
        linear-gradient(var(--grid-line), var(--grid-line)),
        linear-gradient(var(--grid-line), var(--grid-line));
      background-size: 1px 100%, 1px 100%, 1px 100%;
      background-position: left top, center top, right top;
      background-repeat: no-repeat;
    }

    /* ----------------------------------------------- the horizontal rules */
    /* Full bleed, so they cross the verticals and close the field. This is
       the site's own idiom: layout.css draws exactly this line between two
       sections, on the section rather than inside the shell. */
    .panel {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding-block: var(--s-6);
    }

    .shell {
      width: var(--shell);
      margin-inline: auto;
    }

    /* ------------------------------------------------------------- text */
    .eyebrow {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      line-height: 1.4;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* One heading holding both halves, so a screen reader announces the
       whole message rather than an h1 reading "哎呀". */
    h1 {
      margin: var(--s-3) 0 0;
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2.5rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    /* Deliberately not --accent. §1.2: the accent marks interaction or
       measurement, never decoration — so the cobalt on this page is on the
       button and the focus ring, and the 哎呀 carries its weight in size. */
    .oops {
      display: block;
      margin-bottom: var(--s-2);
      font-family: var(--font-hans);
      font-size: clamp(4rem, 13vw, 8.5rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    /* ----------------------------------------------------------- button */
    /* .cv-button from components.css, restated because nothing is imported
       here. Square, not --radius: §1.4 gives the radius to boxes that hold
       something, and a button is not one. */
    .actions { margin: var(--s-4) 0 0; }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 1ch;
      padding: var(--s-2) var(--s-3);
      border: 1px solid var(--ink);
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 0.8125rem;
      letter-spacing: 0.02em;
      line-height: 1.5;
      text-decoration: none;
      transition: border-color 200ms ease, color 200ms ease;
    }

    .button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>

  <div class="grid-field" aria-hidden="true"></div>

  <main class="panel">
    <div class="shell">
      <p class="eyebrow">Error 404</p>

      <h1>
        <span class="oops" lang="zh-Hans">哎呀</span>
        Looks like you went too far
      </h1>

      <p class="actions">
        <!-- Root-relative for the same reason every other path here is:
             served for /work/typo/deep, a relative "index.html" would
             resolve to /work/typo/index.html. -->
        <a class="button" href="/">Back to the homepage <span aria-hidden="true">→</span></a>
      </p>
    </div>
  </main>

</body>
</html>
